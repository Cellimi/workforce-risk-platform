# ---------------------------------------------------------------------------
# Taxonomies. Code must read these, never redefine them.
# ---------------------------------------------------------------------------
taxonomies:
  misconduct_categories:
    - id: attendance_awol
      label: "Attendance / AWOL"
      sworn_only: false
      subtypes: ["Unscheduled absence", "Failure to report", "AWOL", "Leave abuse"]
    - id: tardiness
      label: "Tardiness"
      sworn_only: false
      subtypes: ["Late to shift", "Late from break", "Repeated tardiness"]
    - id: time_falsification
      label: "Time & Attendance falsification"
      sworn_only: false
      subtypes: ["Timesheet falsification", "Buddy punching", "Unearned overtime claim"]
    - id: insubordination
      label: "Insubordination"
      sworn_only: false
      subtypes: ["Refusal of direct order", "Disrespect toward supervisor"]
    - id: conduct_unbecoming
      label: "Conduct unbecoming"
      sworn_only: false
      subtypes: ["Public conduct", "Social media conduct", "Untruthfulness"]
    - id: policy_violation
      label: "Policy / procedure violation"
      sworn_only: false
      subtypes: ["Report writing", "Evidence handling", "Safety procedure", "Records access"]
    - id: use_of_force
      label: "Use-of-force violation"
      sworn_only: true
      subtypes: ["Excessive force", "Failure to report force", "De-escalation failure"]
    - id: vehicle_misuse
      label: "Vehicle misuse / accident"
      sworn_only: false
      subtypes: ["Preventable accident", "Unauthorized use", "Pursuit policy violation"]
    - id: harassment_violence
      label: "Harassment / workplace violence"
      sworn_only: false
      subtypes: ["Harassment", "Hostile conduct", "Threats"]
    - id: drug_alcohol
      label: "Drug / alcohol violation"
      sworn_only: false
      subtypes: ["Positive test", "Refusal to test", "On-duty impairment"]
    - id: neglect_of_duty
      label: "Neglect of duty"
      sworn_only: false
      subtypes: ["Failure to respond", "Post abandonment", "Inattention to duty"]
    - id: off_duty_misconduct
      label: "Off-duty misconduct"
      sworn_only: false
      subtypes: ["Off-duty arrest", "Off-duty conduct"]

  action_types:
    - id: documented_counseling
      label: "Documented counseling"
      severity_rank: 1
      suspension_days_range: [0, 0]
    - id: written_reprimand
      label: "Written reprimand"
      severity_rank: 2
      suspension_days_range: [0, 0]
    - id: suspension_1_3
      label: "Suspension 1-3 days"
      severity_rank: 3
      suspension_days_range: [1, 3]
    - id: suspension_4_14
      label: "Suspension 4-14 days"
      severity_rank: 4
      suspension_days_range: [4, 14]
    - id: suspension_15_plus
      label: "Suspension 15+ days"
      severity_rank: 5
      suspension_days_range: [15, 45]
    - id: demotion
      label: "Demotion"
      severity_rank: 6
      suspension_days_range: [0, 0]
    - id: removal
      label: "Removal / termination"
      severity_rank: 7
      suspension_days_range: [0, 0]

  investigation_types: [supervisory, hr, internal_affairs]
  deciding_official_levels: [supervisor, division_head, department_head, county_administrator]
  appeal_forums: [grievance_step, arbitration, civil_service_board, court]
  appeal_outcomes: [sustained, mitigated, overturned, settled, pending]
  separation_reasons:
    - voluntary_resignation
    - resignation_in_lieu_of_removal
    - removal_for_cause
    - retirement
    - layoff
    - end_of_probation
