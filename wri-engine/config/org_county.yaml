# Harlow County — fictional agency configuration.
#
# NOTHING IN THIS FILE DESCRIBES A REAL AGENCY. Department names, role families, union
# names, locations and pay scales are invented. Magnitudes are anchored on the general
# shape of published county pay scales; no specific real county's data is copied.
#
# Cost coefficients do NOT live here — they live in config/assumptions.yaml. This file
# describes the *organization*: who works where, on what schedule, under which rules.

agency:
  id: harlow_county
  name: "Harlow County"
  fictional: true
  # TBD-MIKE: final fictional county name (open item 7).
  name_status: TBD-MIKE
  fiscal_year_start_month: 7
  headcount_target: 2500

# ---------------------------------------------------------------------------
# Schedule model. Used by C2 (paid admin leave) and C3 (backfill) to convert a
# calendar date range into scheduled shifts. Deliberately simple; documented in
# docs/cost_methodology.md as a known simplification.
# ---------------------------------------------------------------------------
schedules:
  civilian_5x8:
    description: "Monday-Friday, 8-hour days, county holidays off."
    kind: weekday_calendar
    shift_hours: 8
    workdays: [MON, TUE, WED, THU, FRI]
    observes_holidays: true
    annual_paid_hours: 2080
  shift_12:
    description: "Rotating 12-hour shifts, roughly every other day, holidays worked."
    kind: fractional
    shift_hours: 12
    shift_fraction: 0.5          # works ~14 of every 28 calendar days
    observes_holidays: false
    annual_paid_hours: 2080
  fire_24_48:
    description: "24 hours on, 48 hours off; 56-hour average week, holidays worked."
    kind: fractional
    shift_hours: 24
    shift_fraction: 0.3333333333
    observes_holidays: false
    annual_paid_hours: 2912

# Observed county holidays (month-day). Used only by weekday_calendar schedules.
holidays:
  - "01-01"
  - "01-15"
  - "02-19"
  - "05-27"
  - "06-19"
  - "07-04"
  - "09-02"
  - "11-11"
  - "11-28"
  - "11-29"
  - "12-25"

# ---------------------------------------------------------------------------
# Pay plan. Step/grade table: each grade carries a step-1 base salary and a fixed
# percentage step increment. Ten steps per grade.
# ---------------------------------------------------------------------------
pay_plan:
  steps: 10
  step_increment_pct: 2.5
  grades:
    G12: {step1_base: 42000}
    G14: {step1_base: 47000}
    G16: {step1_base: 52000}
    G17: {step1_base: 55000}
    G18: {step1_base: 58000}
    G19: {step1_base: 62000}
    G20: {step1_base: 66000}
    G22: {step1_base: 74000}
    G23: {step1_base: 78000}
    G25: {step1_base: 88000}

bargaining_units:
  - id: deputies_assoc
    name: "Deputies' Association"
  - id: corrections_assoc
    name: "Corrections Officers' Association"
  - id: firefighters_assoc
    name: "Firefighters' Association"
  - id: general_employees
    name: "General Employees' Union"
  - id: non_represented
    name: "Non-represented"

