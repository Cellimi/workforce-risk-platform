# ---------------------------------------------------------------------------
# Private-sector cost model. Added 2026-11-12, owner-approved 2026-11-13, including the five
# private_benefits_multiplier_<occupational group> entries researched that day and the
# bounds on private_benefits_multiplier_all, which he set to the range of those five groups.
#
# Only genuinely new values live here. Where the two sectors do the same thing -- an HR
# officer's hours on a written reprimand, the FLSA overtime premium -- they share the id
# and the value above, so there is one number to confirm rather than two.
#
# Of the first twelve, two are marked researched because a public source fixes the number,
# and they stay researched: a cited source is a stronger claim than a sign-off. The other ten are
# confirmed, which means the owner stands behind them as working figures, not that anyone
# measured them. Each still carries a citation where one exists for the mechanism or the
# range, and says what would settle it -- usually the client's own invoices. Calling a
# vendor pricing page 'researched' would devalue the status on the entries that earned it,
# so none of them claims it.
# ---------------------------------------------------------------------------
- id: private_benefits_multiplier_all
  value: 1.4287
  low: 1.2996
  high: 1.4686
  unit: ratio
  applies_to:
    benefits_group: private_all
  source: 'BLS Employer Costs for Employee Compensation, June 2026 reference period, private industry workers, all workers: total compensation $46.89 per hour worked, wages and salaries $32.82 per hour worked. 46.89 / 32.82 = 1.4287. Benefits are 30.0% of employer costs in private industry, against 38.5% in state and local government, which is why this multiplier sits well below benefits_multiplier_civilian.'
  confidence: medium
  owner: Michael V. Celli
  status: researched
  last_reviewed: '2026-11-13'
  notes: 'The private-sector counterpart to benefits_multiplier_civilian, and the single largest difference between the two sector packs. It is the FALLBACK, used for an employee who has no occupational group of their own in an engagement with none selected; the five private_benefits_multiplier_<group> entries below carry each group''s own figure. VALUE VERIFIED 2026-11-13 against BLS series CMU2010000000000D and CMU2020000000000D on data.bls.gov. BOUNDS: the lowest and highest of the five broad occupational groups in the same series for 2026 Q2 - service at 23.73 / 18.26 = 1.2996 and production, transportation and material moving at 36.70 / 24.99 = 1.4686 - so low and high mode show what an unclassified workforce costs if it is all of the lightest or all of the heaviest kind. OWNER DECISION 2026-11-13: the bounds were changed to these from 1.38 / 1.4835, which had been set before the occupational series could be read; the old high bound rested on a wages figure for the management group that the series does not bear out, and the old low bound did not reach service. The base value did not change. Carries the same per-hour-worked against per-hour-paid caveat as the civilian figure; see docs/cost_methodology.md.'
- id: private_benefits_multiplier_management_professional
  value: 1.4591
  low: 1.432
  high: 1.4809
  unit: ratio
  applies_to:
    benefits_group: private_management_professional
  source: 'BLS Employer Costs for Employee Compensation, private industry workers, management, professional and related occupations, 2026 second quarter (June 2026 reference period): total compensation $78.88 per hour worked (series CMU2010000100000D), wages and salaries $54.06 per hour worked (series CMU2020000100000D), read from data.bls.gov on 2026-11-13. 78.88 / 54.06 = 1.4591.'
  confidence: medium
  owner: Michael V. Celli
  status: researched
  last_reviewed: '2026-11-13'
  notes: 'Loads the wage of a private employee in management, business, financial or professional work. BOUNDS: the envelope of this group''s own ratio over the 20 quarters to 2026 Q2 (1.4320 to 1.4598) and of its two published sub-groups in 2026 Q2 - management, business and financial 88.63 / 59.85 = 1.4809, professional and related 73.69 / 50.98 = 1.4455. Carries the same per-hour-worked against per-hour-paid caveat as benefits_multiplier_civilian. Researched and reviewed by the owner on 2026-11-13; it stays researched because the cited series, not the sign-off, is what stands behind it.'
- id: private_benefits_multiplier_sales_office
  value: 1.3977
  low: 1.3283
  high: 1.4564
  unit: ratio
  applies_to:
    benefits_group: private_sales_office
  source: 'BLS Employer Costs for Employee Compensation, private industry workers, sales and office occupations, 2026 second quarter (June 2026 reference period): total compensation $36.34 per hour worked (series CMU2010000200000D), wages and salaries $26.00 per hour worked (series CMU2020000200000D), read from data.bls.gov on 2026-11-13. 36.34 / 26.00 = 1.3977.'
  confidence: medium
  owner: Michael V. Celli
  status: researched
  last_reviewed: '2026-11-13'
  notes: 'Loads the wage of a private employee in sales or in office and administrative support. BOUNDS: the envelope of this group''s own ratio over the 20 quarters to 2026 Q2 (1.3734 to 1.3977) and of its two published sub-groups in 2026 Q2 - sales and related 35.85 / 26.99 = 1.3283, office and administrative support 36.73 / 25.22 = 1.4564. The two halves of this group differ a good deal, so a client whose staff are mostly sales sits near the low bound and one whose staff are mostly clerical near the high. Carries the same per-hour-worked against per-hour-paid caveat as benefits_multiplier_civilian. Researched and reviewed by the owner on 2026-11-13; it stays researched because the cited series, not the sign-off, is what stands behind it.'
