- id: c3_unpaid_suspension_burden_multiplier
  value: 1.0765
  low: 1.0765
  high: 1.35
  unit: ratio
  applies_to:
    scope: unpaid_suspension_offset
  source: 'Employer FICA that is not paid on wages the employee does not earn: 6.2% OASDI + 1.45% HI
    = 7.65% (26 U.S.C. 3111). Health insurance and OPEB continue during an unpaid suspension and are
    deliberately excluded.'
  confidence: medium
  owner: Michael V. Celli
  status: confirmed
  last_reviewed: '2026-11-12'
  notes: 'The county does NOT save the full loaded cost of an unpaid suspension - it keeps paying health
    and OPEB. It saves the wage plus only the burdens that scale with the wage. Raise the value if
    pension contributions are also suspended with the pay, which is plan-specific. See OPEN ITEM 3.'
- id: c5_vacancy_salary_burden_multiplier
  value: 1.0765
  low: 1.0765
  high: 1.35
  unit: ratio
  applies_to:
    scope: vacancy_salary_offset
  source: 'Employer FICA that is not paid on wages the employee does not earn: 6.2% OASDI + 1.45% HI
    = 7.65% (26 U.S.C. 3111). Health insurance and OPEB for the vacant seat are not counted as saved.'
  confidence: medium
  owner: Michael V. Celli
  status: confirmed
  last_reviewed: '2026-11-12'
  notes: 'Copied from c3_unpaid_suspension_burden_multiplier and given its own id so the two can
    diverge - a vacancy and a suspension are not the same event, and the employer may stop different
    things in each case. Applied to the removed employee''s own base rate across the vacancy period.
    The county does NOT save the full loaded cost - health and OPEB obligations attached to the
    position do not vanish on the separation date. Raise the value if pension contributions also
    stop, which is plan-specific. See OPEN ITEM 3.'
