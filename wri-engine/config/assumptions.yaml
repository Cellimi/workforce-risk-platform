- id: c3_ot_burden_multiplier
  value: 1.0765
  low: 1.0765
  high: 1.35
  unit: ratio
  applies_to:
    scope: overtime
  source: 'Employer FICA on overtime wages: 6.2% OASDI + 1.45% HI = 7.65% (26 U.S.C. 3111). Pensionability
    of overtime is jurisdiction-specific and NOT included in the base value.'
  confidence: medium
  owner: Michael V. Celli
  status: confirmed
  last_reviewed: '2026-11-12'
  notes: OPEN ITEM 3. If overtime is pensionable in the customer's plan, raise this by the employer normal-cost
    rate (the 1.35 high bound assumes a ~27% public-safety employer contribution applies to OT). Health
    and OPEB do not scale with OT and are excluded by design - this is why C3 does NOT use the full benefits
    multiplier.
