# Assumptions registry -- WRI Phase 1 discipline cost baseline.
#
# EVERY cost coefficient the engine uses lives here. Python never hardcodes one. The loader
# (src/wri_engine/costing/assumptions.py) fails hard if the engine asks for an id that is
# not in this file.
#
# Fields
#   id             stable key the engine references
#   value          the base-case value
#   low / high     sensitivity bounds; low <= value <= high is enforced at load
#   unit           what the number means
#   applies_to     selector describing when this assumption is used
#   source         where the number came from. A sourced figure MUST carry its citation.
#   confidence     high | medium | low
#   owner          who signs off
#   status         confirmed | researched | TBD-MIKE
#   last_reviewed  ISO date
#   notes          anything a reader needs, including what to replace it with
#
# status = TBD-MIKE means the value is an owner placeholder awaiting sign-off. The owner
# reviewed and approved the public-sector registry on 2026-11-12 and the twelve values added
# for the private-sector cost model on 2026-11-13, so no entry carries that status any more.
# The five private_benefits_multiplier_<occupational group> entries were researched after
# that and reviewed by him the same day; they are status = researched because each names the
# BLS series it was read from.
#
# READ THE DIFFERENCE BETWEEN THESE TWO FIELDS BEFORE QUOTING A NUMBER.
#   status = confirmed  means the OWNER has signed off on the value as the working figure.
#   status = researched means the value is backed by the CITED SOURCE on the entry.
#   confidence          is unchanged by sign-off: it still says how much weight the value
#                       bears. 90 entries remain low confidence and 91 medium.
# Approving a number is not the same as verifying it. An entry whose source still reads
# "Owner professional estimate" is exactly that - an estimate the owner stands behind, not a
# measured or externally sourced figure.
#
# Generated 2026-09-17; hand-edited from here on.

assumptions:
- id: benefits_multiplier_civilian
  value: 1.627
  low: 1.5
  high: 1.75
  unit: ratio
  applies_to:
    benefits_group: civilian
  source: 'BLS Employer Costs for Employee Compensation, March 2026 (USDL-26-0827, released 2026-06-12),
    Table 1 ''By ownership'': state and local government total compensation $66.41/hr worked, wages and
    salaries $40.82/hr worked. 66.41 / 40.82 = 1.627.'
  confidence: medium
  owner: Michael V. Celli
  status: researched
  last_reviewed: '2026-11-12'
  notes: ECEC is per hour WORKED and counts paid leave as a benefit; our base rate is per hour PAID (salary
    / 2080), so paid-leave hours are mildly double-counted. That biases loaded cost UP by roughly the
    paid-leave share. Documented in docs/cost_methodology.md; refine with ECEC's paid-leave line when
    available.
- id: benefits_multiplier_sworn
  value: 1.75
  low: 1.627
  high: 2.05
  unit: ratio
  applies_to:
    benefits_group: sworn_public_safety
  source: 'Owner professional estimate, accepted by the owner on 2026-11-12 as the working value and
    corroborated on 2026-11-14 against the two nearest series BLS publishes. BLS does not publish
    compensation costs for sworn or protective-service staff on their own, so no single figure
    verifies it. The nearest two, Employer Costs for Employee Compensation, state and local
    government workers, total compensation over wages and salaries per hour worked, read from
    data.bls.gov on 2026-11-14: (1) service occupations, the group that holds police, fire and
    corrections along with non-sworn service staff - 2026 Q1 $50.95 / $28.77 = 1.7709, 2026 Q2
    $51.85 / $29.16 = 1.7781, range over 20 quarters 1.7388 to 1.7781 (series CMU3010000300000D and
    CMU3020000300000D); (2) the public administration industry, all occupations - 2026 Q1 $65.42 /
    $37.44 = 1.7473, 2026 Q2 $65.84 / $37.60 = 1.7511, range over 20 quarters 1.7250 to 1.7511
    (series CMU3019200000000D and CMU3029200000000D). 1.75 lies inside both ranges.'
  confidence: medium
  owner: Michael V. Celli
  status: confirmed
  last_reviewed: '2026-11-14'
  notes: 'OWNER DECISION 2026-11-12: 1.75 stands as the working value. OWNER DECISION 2026-11-14: keep
    1.75 after the check against BLS, and raise confidence from low to medium. It stays confirmed
    rather than researched on purpose: the two series bracket the value, but neither is a figure for
    sworn staff, so the number is still the owner''s, now with evidence beside it. If anything it is
    slightly conservative, since sworn staff usually carry richer pensions than the service-occupations
    average. It scales every sworn figure in the model. The low bound deliberately equals the
    all-occupations figure, so a sensitivity run at low mode shows what the model looks like if the
    public-safety premium turns out to be nil.'
