- id: c4_filing_window_days_agency_charge
  value: 300
  low: 180
  high: 300
  unit: days
  applies_to:
    forum: agency_charge
  source: 'Title VII of the Civil Rights Act, 42 U.S.C. 2000e-5(e)(1): a charge must be filed within 180 days of the alleged unlawful employment practice, extended to 300 days where the person has initially instituted proceedings with a state or local agency with authority to grant relief.'
  confidence: high
  owner: Michael V. Celli
  status: researched
  last_reviewed: '2026-11-12'
  notes: 'The base is 300 because most states have a fair employment practices agency, which triggers the longer window; the low bound 180 is the window where none does. Used by C4 to decide whether an action with no charge on file is still open to one, so its cost is reported as a floor rather than a settled figure. State fair employment statutes can run longer than either bound.'
- id: c3_temp_agency_markup
  value: 1.5
  low: 1.25
  high: 1.75
  unit: ratio
  applies_to:
    coverage_method: temp_agency
  source: 'Staffing industry markups over the worker''s pay rate are commonly quoted in the 25% to 75% range, varying by role and market; the American Staffing Association''s worked example marks a $17.00 average hourly pay rate up 51.5% to a $25.76 bill rate. These are trade and vendor sources, not an official statistic.'
  confidence: low
  owner: Michael V. Celli
  status: confirmed
  last_reviewed: '2026-11-13'
  notes: 'Multiplies the peer base rate to price agency cover, in place of the FLSA premium and overtime burden a peer on overtime would carry: the temp is not working overtime, and the markup already carries the agency''s payroll taxes, insurance, recruiting and margin. Not a researched figure: no authoritative source was reachable, only vendor pricing pages. Confirm against the client''s own staffing invoices, which is the one place the real number exists. Watch the basis - a 50% markup is a 33.3% margin on the bill rate, and quotes use both. OWNER DECISION 2026-11-13 - the owner accepted this value. Accepting a number is not measuring one, so the confidence level is unchanged.'
- id: c1_outside_investigator_hourly_rate
  value: 325
  low: 200
  high: 600
  unit: usd_per_hour
  applies_to:
    scope: processing
  source: 'Owner professional estimate. Defaulted to the outside counsel rate, because a workplace investigation is usually run by employment counsel or a specialist firm billing on the same basis.'
  confidence: low
  owner: Michael V. Celli
  status: confirmed
  last_reviewed: '2026-11-13'
  notes: 'Applies only when the record shows outside investigator hours, so public-sector data produces no line item. Private employers routinely retain an outside investigator for harassment complaints precisely so the investigation is independent of the managers involved. Confirm from the client''s invoices. OWNER DECISION 2026-11-13 - the owner accepted this value. Accepting a number is not measuring one, so the confidence level is unchanged.'
- id: c6_unemployment_experience_rating_multiplier
  value: 1.0
  low: 1.0
  high: 2.0
  unit: ratio
  applies_to:
    scope: unemployment
  source: 'Mechanism: FUTA is 6.0% on the first $7,000 of each employee''s wages with a credit of up to 5.4% for state unemployment tax paid, a net 0.6% and a maximum $42 per employee per year (IRS, Form 940). State unemployment tax is experience rated, so benefits charged to an employer''s account raise its later state rate. The mechanism is documented; the size of the effect for any one employer is not.'
  confidence: low
  owner: Michael V. Celli
  status: confirmed
  last_reviewed: '2026-11-13'
  notes: 'Deliberately 1.0, which counts ONLY the benefits the record says were charged and claims no amplification. Raising it models the later tax increase an experience rated state imposes, which is real but depends on the state''s formula, the employer''s reserve ratio and its taxable payroll. Not a researched figure: 1.0 is a conservative choice rather than a measured figure. The honest way to size it for a client is their own state rate notices across a few years. OWNER DECISION 2026-11-13 - the owner accepted this value. Accepting a number is not measuring one, so the confidence level is unchanged.'
