# Assumptions registry -- WRI Phase 1 discipline cost baseline.
#
# EVERY cost coefficient the engine uses lives here. Python never hardcodes one. The loader
# (src/wri_engine/costing/assumptions.py) fails hard if the engine asks for an id that is
# not in this file.
#
# Fields
#   id             stable key the engine references
#   value          the base-case value
#   low / high     sensitivity bounds; low <= value <= high is enforced at load
#   unit           what the number means
#   applies_to     selector describing when this assumption is used
#   source         where the number came from. A sourced figure MUST carry its citation.
#   confidence     high | medium | low
#   owner          who signs off
#   status         confirmed | researched | TBD-MIKE
#   last_reviewed  ISO date
#   notes          anything a reader needs, including what to replace it with
#
# status = TBD-MIKE means the value is an owner placeholder and MUST be confirmed before the
# demo is shown externally. Section 13 of the implementation plan lists the open items.
#
# Generated 2026-09-17; hand-edited from here on.

assumptions:
- id: benefits_multiplier_civilian
  value: 1.627
  low: 1.5
  high: 1.75
  unit: ratio
  applies_to:
    benefits_group: civilian
  source: 'BLS Employer Costs for Employee Compensation, March 2026 (USDL-26-0827, released 2026-06-12),
    Table 1 ''By ownership'': state and local government total compensation $66.41/hr worked, wages and
    salaries $40.82/hr worked. 66.41 / 40.82 = 1.627.'
  confidence: medium
  owner: Mike Celli
  status: researched
  last_reviewed: '2026-09-17'
  notes: ECEC is per hour WORKED and counts paid leave as a benefit; our base rate is per hour PAID (salary
    / 2080), so paid-leave hours are mildly double-counted. That biases loaded cost UP by roughly the
    paid-leave share. Documented in docs/cost_methodology.md; refine with ECEC's paid-leave line when
    available.
- id: benefits_multiplier_sworn
  value: 1.75
  low: 1.627
  high: 2.05
  unit: ratio
  applies_to:
    benefits_group: sworn_public_safety
  source: Owner professional estimate, pending BLS ECEC Table 3 (state and local government by occupational
    group -> 'protective service'). Public-safety pension normal cost and OPEB typically exceed the all-occupations
    state/local average.
  confidence: low
  owner: Mike Celli
  status: TBD-MIKE
  last_reviewed: '2026-09-17'
  notes: 'CONFIRM FROM PUBLIC DATA: pull ECEC Table 3 protective-service total compensation and wages
    per hour worked, take the ratio, and replace this value. bls.gov was not reachable from the build
    environment. Until then this is an owner estimate, and the low bound deliberately equals the all-occupations
    figure.'
