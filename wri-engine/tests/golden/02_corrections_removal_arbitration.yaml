# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Officer E1: $56,160 / 2,080 = $27.00/hr base x 1.75 sworn = $47.25/hr loaded.
# Sergeant E2 (supervisor): $74,880 / 2,080 = $36.00/hr x 1.75 = $63.00/hr loaded.
# Officer E3 is the only ACTIVE corrections officer, so peer averages use his $28.00/hr base
#   ($45.213/hr with overtime) and $49.00/hr loaded (as the field trainer).
# HR reference $61.0125/hr. Department head $135,000 x 1.627 / 2,080 = $105.598558/hr.
# Division head (internal affairs) $105,000 x 1.627 / 2,080 = $82.132212/hr.
#
# C1 supervisor        30 hrs x $63.000000 = $ 1,890.00
# C1 HR                20 hrs x $61.012500 = $ 1,220.25
# C1 deciding           8 hrs x $105.598558 = $   844.788 -> $844.79
# C1 investigation (IA) 40 hrs x $82.132212 = $ 3,285.288 -> $3,285.29
#
# C2 paid admin leave  2025-04-01 to 2025-06-15 = 76 calendar days.
#                      shift_12 works half of them: 76 x 0.5 = 38.0 shifts x 12 hrs = 456 hrs
#                      456 x $47.25 = $21,546.00
# C3 backfill          same 456 hrs x $45.213 overtime = $20,617.128 -> $20,617.13
#                      (the county pays for the leave AND for covering the post)
#
# C4 internal HR       arbitration: 40 hrs x $61.0125 = $2,440.50
# C4 outside counsel   35 hrs x $325 = $11,375.00
# C4 arbitration fees  $7,500.00 flat
# C4 back pay          $28,000.00 from the record
# C4 interest          2025-07-01 to 2026-03-01 = 243 days.
#                      $28,000 x 0.05 x 243/365 = $932.0548 -> $932.05
#
# C5, corrections profile, washout 0.30 -> every recruiting/training item x 1/0.70 = 1.428571
#   vacancy overtime   2025-06-21 to 2025-12-18 = 181 days x 0.5 = 90.5 shifts x 12 = 1,086 hrs
#                      1,086 x $45.213 = $49,101.318 -> $49,101.32   (not washout-adjusted)
#   C5-OFFSET          The officer's own pay stops for the same 1,086 hours. Credited at HIS
#                      base rate ($27.00), not the peer rate used for the overtime above:
#                      1,086 hrs x $27.00 x 1.0765 wage-scaling burden = $31,565.133
#                      -> -$31,565.13, recorded negative. Health and OPEB for the vacant
#                      seat are not treated as saved.
#   advertising        $2,000 x 1.428571 = $2,857.14
#   recruiter hours    30 hrs x $61.0125 = $1,830.375 x 1.428571 = $2,614.82
#   testing            $250 x 1.428571 = $357.14
#   interview panel    3 x 1.5 hrs x $63.00 = $283.50 x 1.428571 = $405.00
#   background         $2,200 -> $3,142.86      polygraph $375 -> $535.71
#   psychological      $450 -> $642.86          medical   $350 -> $500.00
#   drug screen        $65 -> $92.86
#   Replacement rate:  G17 step 1 = $55,000 / 2,080 = $26.442308 x 1.75 = $46.274038/hr
#   orientation        32 hrs x $46.274038 = $1,480.769 x 1.428571 = $2,115.38
#   academy tuition    $2,800 x 1.428571 = $4,000.00
#   academy salary     6 wks x 40 hrs = 240 hrs x $46.274038 = $11,105.77 x 1.428571 = $15,865.38
#   field training     6 wks x 40 hrs = 240 hrs x $46.274038 = $11,105.77 x 1.428571 = $15,865.38
#   trainer diff.      240 hrs x $49.00 x 0.05 = $588.00 x 1.428571 = $840.00
#   equipment          $2,200 x 1.428571 = $3,142.86
#
# C1 $7,240.33 + C2 $21,546.00 + C3 $20,617.13 + C4 $50,247.55 + C5 $102,078.71
# Gross   $201,729.72
# Offset  -$31,565.13   (vacancy salary; no unpaid suspension in this case)
# Net     $170,164.59

