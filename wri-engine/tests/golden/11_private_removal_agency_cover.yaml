name: "Private-sector removal: agency cover, severance and an unemployment claim"
description: >
  A warehouse associate on a post that has to be staffed. The employer covers the absence
  with an agency temp rather than a peer on overtime, and the removal ends in a signed
  separation agreement with an unemployment claim behind it. Exercises the private benefits
  multiplier, agency cover in both C3 and C5, and the whole of C6.
sector: private_sector
as_of: 2026-11-12
action_under_test: A1

