# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# PRIVATE-SECTOR RATES. The multiplier is 1.4287 (BLS ECEC June 2026, private industry:
#   $46.89 total compensation / $32.82 wages per hour worked), NOT the 1.627 a government
#   employer carries. That single difference runs through every line below.
#   Associate E1:  $41,600 / 2,080 = $20.00/hr base -> $28.574/hr loaded.
#   Supervisor E2: $62,400 / 2,080 = $30.00/hr base -> $42.861/hr loaded.
#   HR reference:  $78,000 / 2,080 = $37.50/hr      -> $53.57625/hr loaded.
#   Department head: $135,000 x 1.4287 / 2,080 = $92.728125/hr.
#   Associate E3 is the only ACTIVE associate, so peer cover is priced off his $20.00 base.
#
# C1 supervisor     30 hrs x $42.861    = $1,285.83
# C1 HR             20 hrs x $53.57625  = $1,071.525 -> $1,071.53
# C1 deciding        8 hrs x $92.728125 = $741.825 at four decimals, but the exact product
#                    of 135000/1.4287/2080 is a shade under that, so it rounds to $741.82
# C1 investigation  16 hrs x $53.57625  = $857.22   (HR investigation)
#
# THE ABSENCE, COVERED BY AN AGENCY
#   Suspended on pay 2026-02-16 to 2026-03-10 = 23 calendar days. Monday to Friday only:
#   17 weekdays, less the 19 February holiday, = 16 working days x 8 hrs = 128 hours.
#   C2 paid leave     128 hrs x $28.574 loaded = $3,657.472 -> $3,657.47
#   C3 cover          128 hrs x ($20.00 peer base x 1.50 agency markup = $30.00) = $3,840.00
#   No FLSA premium and no overtime burden: the temp is not working overtime, and the
#   markup already carries the agency's taxes, insurance and margin.
#
# THE VACANCY, 2026-03-14 to 2026-05-12 = 60 calendar days, 42 working days = 336 hours.
#   C5 cover          336 hrs x $30.00 agency = $10,080.00  (same method as the absence)
#   C5-offset         336 hrs x $20.00 base x 1.0765 burden = $7,234.08, credited back
#
# C5, civilian_standard profile, washout 0.12 -> recruiting and training items x 1/0.88
#   Replacement rate: entry salary $37,440 / 2,080 = $18.00 x 1.4287 = $25.7166/hr
#   advertising     $600 -> $681.82        background $250 -> $284.09
#   recruiter       12 hrs x $53.57625 = $642.915 -> $730.59
#   panel           2 x 1 hr x $42.861 = $85.722 -> $97.41
#   drug screen     $65 -> $73.86          equipment  $300 -> $340.91
#   orientation     12 hrs x $25.7166 = $308.60 -> $350.68
#   ramp            6 wks x 40 hrs = 240 hrs x $25.7166 = $6,171.98 x 0.30 = $1,851.60
#                   (not washout-adjusted: only the person who stays ramps up)
#   No testing, no medical, no academy, no field training for this profile.
#
# C6, the costs that follow the removal out of the door
#   severance       $12,000.00 from the record. Never estimated: an agreement with no
#                   amount recorded would be reported, not guessed at.
#   HR time          8 hrs x $53.57625 = $428.61
#   counsel          4 hrs x $325.00    = $1,300.00
#   unemployment    $6,500.00 charged to the employer's account x 1.0, which counts the
#                   actual charge and claims no experience-rating amplification
#
# C1 $3,956.40 + C2 $3,657.47 + C3 $3,840.00 + C5 $14,490.96 + C6 $20,228.61
# Gross   $46,173.44
# Offset  -$7,234.08
# Net     $38,939.36

