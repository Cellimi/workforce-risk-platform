# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Deputy E1, top of grade: $78,000 / 2,080 = $37.50/hr base x 1.75 sworn = $65.625 loaded.
#   His own loaded rate is not used by C5 - a replacement starts at step 1 - but his BASE
#   rate is what the vacancy offset credits back.
# Sergeant E2 (supervisor): $40.00/hr base x 1.75 = $70.00/hr loaded.
# Deputy E3 is the only ACTIVE deputy, at the bottom of the grade: $62,400 / 2,080 =
#   $30.00/hr base -> $48.4425/hr with overtime, and $52.50/hr loaded as field trainer.
#   So the removed employee earned 37.50 / 30.00 = 1.25x the peer average.
# County administrator: $175,000 x 1.627 / 2,080 = $136.887019/hr.
#
# C1 supervisor  30 hrs x $70.00      = $2,100.00
# C1 HR          20 hrs x $61.0125    = $1,220.25
# C1 deciding     8 hrs x $136.887019 = $1,095.096 -> $1,095.10
# Not investigated, so no investigation hours.
#
# THE VACANCY, BOTH SIDES OF IT
#   Separated 2025-03-15, replacement on solo duty 2025-09-11 = 180 calendar days.
#   shift_12 works half of them: 180 x 0.5 = 90 shifts x 12 hrs = 1,080 hours.
#   BOTH line items below use that same 90 shifts, so the charge and the credit cover
#   exactly the same period.
#
#   C5 vacancy overtime   charged at the PEER's rate, because a peer works the shifts:
#                         1,080 hrs x $30.00 base x 1.5 FLSA x 1.0765 OT burden
#                         = 1,080 x $48.4425 = $52,317.90
#   C5-offset salary      credited at the REMOVED EMPLOYEE's rate, because his pay is what
#                         stops: 1,080 hrs x $37.50 base x 1.0765 wage-scaling burden
#                         = 1,080 x $40.36875 = $43,598.25 -> recorded negative
#
#   Net cost of the vacancy = $52,317.90 - $43,598.25 = $8,719.65, which is 16.7% of the
#   gross overtime. Charging the overtime without the credit would overstate the vacancy
#   by a factor of six.
#
# THE BOUND, WHICH THIS CASE PINS DOWN
#   offset / overtime = own_base / (avg_base x 1.5), since both sides carry the same 1.0765
#   burden at base values. Here that is 37.50 / (30.00 x 1.5) = 0.8333 exactly.
#   Within one pay grade the widest possible spread is step 10 over step 1 = 1.025^9 =
#   1.2489, so the ratio can never exceed 1.2489 / 1.5 = 0.8326 in base mode. This case sits
#   at that ceiling by construction.
#   THE OFFSET THEREFORE CANNOT EXCEED THE OVERTIME AT BASE ASSUMPTIONS - the 1.5x FLSA
#   premium guarantees it. It can only overtake the charge if the two burden multipliers
#   diverge, for example c5_vacancy_salary_burden_multiplier at its 1.35 high bound (pension
#   stops with the pay) while c3_ot_burden_multiplier stays at 1.0765:
#   1.2489 x 1.35 / (1.5 x 1.0765) = 1.044. That is exactly why the vacancy burden has its
#   own assumption id. tests/test_properties.py asserts both halves of this.
#
# C5, sworn_deputy profile, washout 0.25 -> recruiting and training items x 1/0.75 = 1.333333
#   advertising       $2,500 -> $3,333.33
#   recruiter hours   40 hrs x $61.0125 = $2,440.50 x 1.333333 = $3,254.00
#   testing           $350 -> $466.67
#   interview panel   3 x 2 hrs x $70.00 = $420.00 x 1.333333 = $560.00
#   background        $3,500 -> $4,666.67   polygraph $375 -> $500.00
#   psychological     $550 -> $733.33       medical   $350 -> $466.67   drug $65 -> $86.67
#   Replacement rate: G19 step 1 = $62,000 / 2,080 = $29.807692 x 1.75 = $52.163462/hr
#   orientation       40 hrs x $52.163462 = $2,086.54 x 1.333333 = $2,782.05
#   academy tuition   $6,500 x 1.333333 = $8,666.67
#   academy salary    22 wks x 40 hrs = 880 hrs x $52.163462 = $45,903.85 -> $61,205.13
#   field training    14 wks x 40 hrs = 560 hrs x $52.163462 = $29,211.54 -> $38,948.72
#   trainer diff.     560 hrs x $52.50 x 0.07 = $2,058.00 x 1.333333 = $2,744.00
#   equipment         $6,500 x 1.333333 = $8,666.67
#
# C1 $4,415.35 + C5 $189,398.48
# Gross   $193,813.83
# Offset  -$43,598.25
# Net     $150,215.58

