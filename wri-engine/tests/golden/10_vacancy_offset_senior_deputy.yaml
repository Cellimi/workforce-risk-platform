name: "Vacancy salary offset for a top-step deputy backfilled by a junior peer"
description: >
  The case that makes the vacancy offset visible. A long-tenured deputy at the top of the
  grade is removed; the post is minimum-staffing, so it is covered by overtime worked by a
  peer at the bottom of the grade. The county is charged gross overtime at the PEER's rate
  and credited the salary it stops paying at the REMOVED EMPLOYEE's rate, over exactly the
  same 90 shifts.

  Because the removed employee earned 1.25x the peer average, the credit is large - 83% of
  the overtime charge - so the net cost of the vacancy is a small fraction of the gross. Read
  the bound note at the bottom before concluding the offset can overtake the charge.
