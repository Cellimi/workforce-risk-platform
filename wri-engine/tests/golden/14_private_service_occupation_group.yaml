name: "Private-sector occupational groups: a service worker is not loaded like a manager"
description: >
  A line cook is sent home on pay for three shifts while a complaint is looked at, then given
  a written reprimand. The cook's wage is loaded at the service-occupations multiplier, the
  kitchen manager's at the management and professional one, and the HR officer -- who is in
  nobody's file -- at the all-occupations figure. Three multipliers in one small action, each
  from its own published BLS series.
