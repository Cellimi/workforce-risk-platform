# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# THREE MULTIPLIERS, EACH FROM ITS OWN BLS SERIES (private industry, 2026 Q2):
#   service occupations                     $23.73 / $18.26 = 1.2996
#   management, professional and related    $78.88 / $54.06 = 1.4591
#   all occupations (the fallback)          $46.89 / $32.82 = 1.4287
#
# Cook E1:     $37,440 / 2,080 = $18.00/hr base x 1.2996 = $23.3928/hr loaded.
# Manager E2:  $62,400 / 2,080 = $30.00/hr base x 1.4591 = $43.773/hr loaded.
# HR reference:        $78,000 / 2,080 = $37.50     x 1.4287 = $53.57625/hr.
# Supervisor-level deciding official, not named on the record, so the reference salary:
#                      $85,000 x 1.4287 / 2,080 = $58.384375/hr.
# The two reference rates use the all-occupations figure because nobody knows what kind of
# work a person who is not in the file does; that is what the fallback is for.
#
# C1 supervisor   4 hrs x $43.773     = $175.092    -> $175.09
# C1 HR           2 hrs x $53.57625   = $107.1525   -> $107.15
# C1 deciding     1 hr  x $58.384375  = $58.384375  -> $58.38
#
# C2 PAID LEAVE. Tuesday 4 to Thursday 6 August 2026 is three scheduled 8-hour shifts.
#   3 shifts x 8 hrs x $23.3928 = $561.4272 -> $561.43
#
#   THE POINT OF THIS CASE: at the all-occupations multiplier the same leave would have been
#   3 x 8 x $18.00 x 1.4287 = $617.20. Loading a service worker at the average overstates
#   this line by $55.77, about a tenth, and it does so on every hour of every service
#   worker's leave in the client's file.
#
# No cover (the post has no staffing requirement), no suspension, no challenge, no removal.
#
# Gross = Net = $175.09 + $107.15 + $58.38 + $561.43 = $902.05

expected:
  line_items:
    - {component: C1, subcomponent: deciding_hours, amount: '58.38'}
    - {component: C1, subcomponent: hr_hours, amount: '107.15'}
    - {component: C1, subcomponent: supervisor_hours, amount: '175.09'}
    - {component: C2, subcomponent: paid_admin_leave, amount: '561.43'}
  gross: '902.05'
  offset: '0.00'
  net: '902.05'
  cost_incomplete: false
