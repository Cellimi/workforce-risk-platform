# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Park maintenance worker E1: $41,600 / 2,080 = $20.00/hr x 1.627 = $32.54/hr loaded
#   (his own rate is not used -- counseling costs other people's time, not his).
# Recreation specialist E2, named as both supervisor and deciding official:
#   $52,000 / 2,080 = $25.00/hr x 1.627 = $40.675/hr loaded.
#
# C1 supervisor   2 hrs x $40.675   = $81.35
# C1 HR         0.5 hrs x $61.0125  = $30.506 -> $30.51
# C1 deciding   0 hrs for a documented counseling -> no line item is emitted at all.
#
# No suspension, no leave, no appeal, no separation.
# Gross = Net = $111.86

expected:
  line_items:
    - {component: C1, subcomponent: hr_hours, amount: '30.51'}
    - {component: C1, subcomponent: supervisor_hours, amount: '81.35'}
  gross: '111.86'
  offset: '0'
  net: '111.86'
  cost_incomplete: false
