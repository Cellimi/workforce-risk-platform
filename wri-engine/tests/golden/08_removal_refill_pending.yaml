# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Maintenance worker E1: $45,760 / 2,080 = $22.00/hr x 1.627 = $35.794/hr loaded.
# Crew supervisor E2: $32.00/hr base x 1.627 = $52.064/hr loaded.
#
# C1 supervisor     30 hrs x $52.064    = $1,561.92
# C1 HR             20 hrs x $61.0125   = $1,220.25
# C1 deciding        8 hrs x $105.598558 = $  844.79
# C1 investigation   6 hrs x $52.064    = $  312.38
#
# C5, civilian_standard, washout 0.12 -> x 1/0.88 = 1.136364.
# The position is NOT refilled, so the vacancy uses the expected duration for the profile,
# 60 days, and every C5 line is flagged cost_incomplete.
#   vacancy        2026-08-01 to 2026-09-29 = 60 calendar days.
#                  Mon-Fri only: 42 weekdays, less the 09-02 holiday (a Wednesday) = 41 days.
#                  Loaded daily rate $35.794 x 8 = $286.352.
#                  41 x $286.352 x 0.5 = $5,870.216 -> $5,870.22
#   advertising    $600 x 1.136364 = $681.82
#   recruiter      12 hrs x $61.0125 = $732.15 x 1.136364 = $831.99
#   panel          2 x 1 hr x $52.064 = $104.128 x 1.136364 = $118.33
#   background     $250 -> $284.09      drug screen $65 -> $73.86
#   Replacement:   G12 step 1 = $42,000 / 2,080 = $20.192308 x 1.627 = $32.852885/hr
#   orientation    12 hrs x $32.852885 = $394.235 x 1.136364 = $447.99
#   equipment      $300 x 1.136364 = $340.91
#   ramp           6 wks x 40 hrs = 240 hrs x $32.852885 = $7,884.69 x 0.30 = $2,365.41
#   No testing, no medical exam, no academy and no field training for this profile.
#
# C1 $3,939.34 + C5 $11,014.62 = Gross = Net = $14,953.96, cost_incomplete = true

expected:
  line_items:
    - {component: C1, subcomponent: deciding_hours, amount: '844.79'}
