# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Deputy E1: $72,800 / 2,080 = $35.00/hr base x 1.75 = $61.25/hr loaded (his own rate is not
#   used for C5 -- a replacement starts at step 1).
# Sergeant E2 (supervisor): $40.00/hr base x 1.75 = $70.00/hr loaded.
# Deputy E3 is the only ACTIVE deputy: $32.00/hr base -> $51.672/hr with overtime,
#   and $56.00/hr loaded as the field training officer.
# County administrator: $175,000 x 1.627 / 2,080 = $136.887019/hr.
#
# C1 supervisor  30 hrs x $70.00       = $2,100.00
# C1 HR          20 hrs x $61.0125     = $1,220.25
# C1 deciding     8 hrs x $136.887019  = $1,095.096 -> $1,095.10
# No investigation on the record, so no investigation hours.
#
# C5, sworn_deputy profile, washout 0.25 -> x 1/0.75 = 1.333333
#   vacancy overtime  2024-10-01 to 2025-03-29 = 180 days x 0.5 = 90 shifts x 12 = 1,080 hrs
#                     1,080 x $51.672 = $55,805.76   (not washout-adjusted)
#   C5-OFFSET         His own pay stops for the same 1,080 hours, credited at HIS base rate
#                     ($35.00), not the $32.00 peer rate the overtime was charged at:
#                     1,080 hrs x $35.00 x 1.0765 = $40,691.70 -> recorded negative.
#   advertising       $2,500 -> $3,333.33
#   recruiter hours   40 hrs x $61.0125 = $2,440.50 x 1.333333 = $3,254.00
#   testing           $350 -> $466.67
#   interview panel   3 x 2 hrs x $70.00 = $420.00 x 1.333333 = $560.00
#   background        $3,500 -> $4,666.67   polygraph $375 -> $500.00
#   psychological     $550 -> $733.33       medical   $350 -> $466.67   drug $65 -> $86.67
#   Replacement rate: G19 step 1 = $62,000 / 2,080 = $29.807692 x 1.75 = $52.163462/hr
#   orientation       40 hrs x $52.163462 = $2,086.54 x 1.333333 = $2,782.05
#   academy tuition   $6,500 x 1.333333 = $8,666.67
#   academy salary    22 wks x 40 hrs = 880 hrs x $52.163462 = $45,903.85
#                     x 1.333333 = $61,205.13   <- the single largest item
#   field training    14 wks x 40 hrs = 560 hrs x $52.163462 = $29,211.54 x 1.333333 = $38,948.72
#   trainer diff.     560 hrs x $56.00 x 0.07 = $2,195.20 x 1.333333 = $2,926.93
#   equipment         $6,500 x 1.333333 = $8,666.67
#
# C1 $4,415.35 + C5 $193,069.27
# Gross   $197,484.62
# Offset  -$40,691.70   (vacancy salary)
# Net     $156,792.92

