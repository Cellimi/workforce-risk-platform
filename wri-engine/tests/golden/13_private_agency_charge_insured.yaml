name: "Agency charge settled under an insurance policy, with an outside investigator"
description: >
  A reprimand draws a charge at an enforcement agency. The employer brings in an outside
  investigator, defends the charge and settles. A liability policy carries most of it: the
  employer pays its retention, the insurer pays the rest. Gross shows the full exposure,
  the offset credits the insurer's share, and net is what the employer actually bore.

  The case carries both insurance data shapes on purpose. On the charge the settlement is
  recorded, so the retention is already inside it and is NOT booked again. On the demand
  letter nothing but the deductible is recorded, so the deductible is the cost. Getting this
  wrong in either direction misstates the matter by the size of the retention.
