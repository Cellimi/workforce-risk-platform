# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Associate E1: $52,000 / 2,080 = $25.00/hr base x 1.4287 = $35.7175/hr loaded.
# Manager E2:   $83,200 / 2,080 = $40.00/hr base x 1.4287 = $57.148/hr loaded.
# HR reference $53.57625/hr; division head $72.121875/hr; outside counsel $325/hr.
#
# C1, a written reprimand plus the investigation it took
#   supervisor            4 hrs x $57.148    = $228.592 -> $228.59
#   HR                    2 hrs x $53.57625  = $107.1525 -> $107.15
#   deciding              1 hr  x $72.121875 = $72.12
#   investigation (HR)   16 hrs x $53.57625  = $857.22
#   outside investigator 20 hrs x $325.00    = $6,500.00
#     A public employer uses its own investigator and records nothing here. A private
#     employer facing a harassment complaint retains an outside firm precisely so the
#     investigation is independent of the managers involved, and it is billed by the hour.
#
# C4, the charge and the demand letter
#   agency charge, internal  25 hrs x $53.57625 = $1,339.40625 -> $1,339.41
#   demand letter, internal   6 hrs x $53.57625 = $321.4575 -> $321.46
#   outside counsel          60 hrs x $325.00   = $19,500.00
#   settlement               $45,000.00 from the record
#   No arbitration fee: the forum is an agency charge, not arbitration. No back pay, so no
#   interest.
#
# C7, WHO ACTUALLY PAID, AND THE TRAP IN IT
#   On the CHARGE the insurer paid $30,000 of the $45,000 settlement. The settlement is
#   already in gross, so the employer's $15,000 retention is already in the number too --
#   it is simply the part the offset does not credit back. Booking that retention again as
#   its own line would overstate the matter by exactly $15,000, so it is NOT booked, and a
#   validation warning records the ambiguity for the engagement to resolve.
#       C7-offset  -$30,000.00
#   On the DEMAND LETTER nothing but the deductible is recorded, which is what a client's
#   accounts payable export looks like when the broker handled the matter. With no
#   settlement to sit inside, the deductible IS the cost:
#       C7 policy retention  $10,000.00
#
# Gross   $83,925.95   the full exposure, insurer's share included
# Offset  -$30,000.00  what the insurer bore
# Net     $53,925.95   what the employer bore

