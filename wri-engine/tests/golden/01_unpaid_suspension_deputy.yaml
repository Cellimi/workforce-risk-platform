# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Deputy E1: $62,400 / 2,080 paid hrs = $30.00/hr base. Sworn benefits multiplier 1.75
#   -> $52.50/hr loaded.
# Sergeant E2 (named as supervisor AND as deciding official): $83,200 / 2,080 = $40.00/hr
#   base -> $70.00/hr loaded.
# HR reference rate: $78,000 / 2,080 = $37.50/hr x 1.627 = $61.0125/hr.
#
# C1 supervisor        12 hrs x $70.0000 = $  840.00
# C1 HR / labor rel.   10 hrs x $61.0125 = $  610.125 -> $610.13
# C1 deciding official  4 hrs x $70.0000 = $  280.00   (E2 is named, so his own rate applies)
# C1 investigation      6 hrs x $70.0000 = $  420.00   (supervisory investigation)
# C3 backfill          5 shifts x 12 hrs = 60 hrs.
#                      Peer base rate $30.00 x 1.5 FLSA x 1.0765 OT burden = $48.4425/hr
#                      60 x $48.4425 = $2,906.55
# C3-offset            60 hrs x $30.00 base x 1.0765 wage burden = $1,937.70, recorded negative
# C4                   none: no appeal filed, and the 30-day window closed on 2026-02-14
# C5                   none: no separation
#
# Gross  840.00 + 610.13 + 280.00 + 420.00 + 2,906.55 = $5,056.68
# Offset -$1,937.70
# Net    $3,118.98

expected:
  line_items:
    - {component: C1, subcomponent: deciding_hours, amount: '280.00'}
    - {component: C1, subcomponent: hr_hours, amount: '610.13'}
    - {component: C1, subcomponent: investigation_supervisory, amount: '420.00'}
    - {component: C1, subcomponent: supervisor_hours, amount: '840.00'}
    - {component: C3, subcomponent: backfill_suspension, amount: '2906.55'}
    - {component: C3-offset, subcomponent: unpaid_suspension_salary_saved, amount: '-1937.70'}
  gross: '5056.68'
  offset: '-1937.70'
  net: '3118.98'
