[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wri-engine"
version = "0.3.0"
description = "Workforce Risk Intelligence - Phase 1: fully loaded cost of discipline"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Michael V. Celli"}]
classifiers = [
    "License :: Other/Proprietary License",
    # Guard rail: setuptools/twine refuse to upload anything carrying this classifier.
    # This package is proprietary and must never reach a public index.
    "Private :: Do Not Upload",
]
# Target is Python 3.12; 3.11 is supported so the project runs on older toolchains.
requires-python = ">=3.11"
# What the engine and its API import. A library the screen needs belongs in `ui`, and one
# only the tests need belongs in `dev`; tests/test_dependencies.py holds each entry here to
# being used. The exact versions that ship are in requirements.lock (`make lock`).
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "cryptography>=42.0",
    # Single sign-on: talking to the firm's identity provider, and checking what it signs.
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
# The screen. It talks to the API over HTTP (httpx) and lays tables out with pandas.
ui = ["streamlit>=1.50", "plotly>=5.18", "pandas>=2.2", "httpx>=0.27"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "pypdf>=4.0",
    "httpx>=0.27",
    "packaging>=23",
]

[project.scripts]
wri-generate = "wri_engine.generator.cli:main"
wri-admin = "wri_engine.admin_cli:main"
wri-license = "wri_engine.licensing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:wri_engine.*"]

[tool.coverage.run]
source = [
    "wri_engine.costing",
    "wri_engine.aggregation",
    "wri_engine.adapters",
    "wri_engine.access",
    "wri_engine.store",
    "wri_engine.api",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
