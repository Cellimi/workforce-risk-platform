# Intervention library -- WRI Phase 3.
#
# Starting figures for the interventions the owner's program overview names. A consultant
# may start an appraisal from one of these on the Interventions page, then change any
# figure to the client's own. Nothing here is used unless a person chooses it.
#
# EVERY VALUE BELOW IS A PLACEHOLDER. On 2026-11-16 the owner asked the build to "go with
# your placeholder assumptions" and said he will research them himself. None is researched
# and none is sourced: each is a round figure chosen only so the arithmetic can be tried.
# Each is TBD-MIKE until he has researched, cited and reviewed it (CLAUDE.md rule 7), and
# while any figure an appraisal started from is TBD-MIKE, the screen and the client report
# say so beside it.
#
# The shape of an entry is the cost registry's, and the rules are the same: fetched by id,
# a missing id is a hard error, and low <= value <= high. For the share of actions
# prevented, low, value and high are the appraisal's low, expected and high readings.

library:
  - id: transit_subsidy
    label: "Transit subsidy"
    description: "A subsidy toward each covered employee's public transit to work."
    answers: [commuting]
    one_time_cost_per_person: intervention_transit_subsidy_one_time_cost_per_person
    annual_cost_per_person: intervention_transit_subsidy_annual_cost_per_person
    reduction: intervention_transit_subsidy_reduction
  - id: childcare_subsidy
    label: "Childcare subsidy"
    description: "A subsidy toward childcare for each covered employee with children."
    answers: [childcare]
    one_time_cost_per_person: intervention_childcare_subsidy_one_time_cost_per_person
    annual_cost_per_person: intervention_childcare_subsidy_annual_cost_per_person
    reduction: intervention_childcare_subsidy_reduction
  - id: targeted_training
    label: "Targeted training"
    description: "Training on what people in the unit are being disciplined for, with a yearly refresher."
    answers: [training]
    one_time_cost_per_person: intervention_targeted_training_one_time_cost_per_person
    annual_cost_per_person: intervention_targeted_training_annual_cost_per_person
    reduction: intervention_targeted_training_reduction
  - id: flexible_hours
    label: "Flexible start and end times"
    description: "Letting covered employees vary their start and end times within set limits."
    answers: [scheduling]
    one_time_cost_per_person: intervention_flexible_hours_one_time_cost_per_person
    annual_cost_per_person: intervention_flexible_hours_annual_cost_per_person
    reduction: intervention_flexible_hours_reduction

