# Detection settings -- WRI Phase 2.
#
# The thresholds that decide when a unit's discipline rate is said to stand out. They are
# kept apart from config/assumptions.yaml on purpose: that file holds what the cost baseline
# rests on, and nothing here can move a dollar of it. The shape of an entry is the same, and
# so is the rule: Python never hardcodes one of these, and a missing id is a hard error.
#
# status = TBD-MIKE means the value is a starting point proposed by the build and NOT yet
# reviewed by the owner. Neither entry below is in that state: the owner reviewed both on
# 2026-11-16 and kept the values. They are judgements about how cautious a flag should be,
# not facts that can be looked up, so they are his to set, and a new one starts as TBD-MIKE.

assumptions:
- id: detection_false_discovery_rate
  value: 0.05
  low: 0.01
  high: 0.10
  unit: proportion
  applies_to:
    detector: hotspots
  source: 'Method: Benjamini, Y. and Hochberg, Y. (1995), "Controlling the false discovery rate: a
    practical and powerful approach to multiple testing", Journal of the Royal Statistical Society
    Series B 57(1), 289-300. The method is theirs; the level of 0.05 is a starting value proposed by
    the build, not a sourced figure. Reviewed and kept by the owner on 2026-11-16.'
  confidence: low
  owner: Michael V. Celli
  status: confirmed
  last_reviewed: '2026-11-16'
  notes: Many units are compared at once, so some would look unusual by chance alone. This is the
    share of flagged units that may be chance findings, on average. Lower is more cautious - fewer
    flags, and fewer of them wrong. 0.05 says that, over many uses, about one flag in twenty is
    expected to be chance. A flag is a statement about a group and is not evidence about any person.

- id: detection_min_rate_ratio
  value: 1.5
  low: 1.25
  high: 2.0
  unit: ratio
  applies_to:
    detector: hotspots
  source: Starting value proposed by the build. No external source - what counts as a difference worth
    a person's attention is a judgement for the owner and, in an engagement, for the consultant.
    Reviewed and kept by the owner on 2026-11-16.
  confidence: low
  owner: Michael V. Celli
  status: confirmed
  last_reviewed: '2026-11-16'
  notes: A very large unit can differ from its comparison by a few percent and still pass a statistical
    test. This is how many times the comparison rate a unit's rate must be before it is flagged, so
    that a flag means a difference large enough to matter and not merely one that is unlikely to be
    chance. 1.5 means half as many actions again as the same job shows elsewhere.
