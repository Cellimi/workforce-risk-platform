# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Caseworker E1: $62,400 / 2,080 = $30.00/hr x 1.627 civilian = $48.81/hr loaded.
# Supervisor E2: $83,200 / 2,080 = $40.00/hr x 1.627 = $65.08/hr loaded.
# HR reference $61.0125/hr; department head $105.598558/hr.
#
# C1 supervisor     30 hrs x $65.08     = $1,952.40
# C1 HR             20 hrs x $61.0125   = $1,220.25
# C1 deciding        8 hrs x $105.598558 = $844.79
# C1 investigation  16 hrs x $61.0125   = $976.20   (HR investigation)
#
# C2, C3 none: no administrative leave, and the role has no minimum staffing requirement.
#
# C5, civilian_skilled profile, washout 0.10 -> x 1/0.90 = 1.111111
#   vacancy           2025-04-12 to 2025-07-10 = 90 calendar days.
#                     Mon-Fri only: 64 weekdays, less 3 county holidays that fall on a
#                     weekday in the range (05-27 Tue, 06-19 Thu, 07-04 Fri) = 61 work days.
#                     Loaded daily rate $48.81 x 8 hrs = $390.48.
#                     61 x $390.48 x 0.5 loss factor = $11,909.64
#   advertising       $900 x 1.111111 = $1,000.00
#   recruiter hours   18 hrs x $61.0125 = $1,098.225 x 1.111111 = $1,220.25
#   interview panel   3 x 1.5 hrs x $65.08 = $292.86 x 1.111111 = $325.40
#   background        $300 -> $333.33     medical $150 -> $166.67     drug $65 -> $72.22
#   Replacement rate: G18 step 1 = $58,000 / 2,080 = $27.884615 x 1.627 = $45.368269/hr
#   orientation       16 hrs x $45.368269 = $725.892 x 1.111111 = $806.55
#   equipment         $400 x 1.111111 = $444.44
#   productivity ramp 12 wks x 40 hrs = 480 hrs x $45.368269 = $21,776.77 x 0.35 = $7,621.87
#                     NOT washout-adjusted: only the person who stays ramps up.
#   No academy, no field training, no polygraph, no psychological evaluation for this profile.
#
# C1 $4,993.64 + C5 $23,900.37 = Gross = Net = $28,894.01

