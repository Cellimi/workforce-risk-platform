# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Telecommunicator E1: $52,000 / 2,080 = $25.00/hr x 1.627 civilian = $40.675/hr loaded.
# Shift supervisor E2: $72,800 / 2,080 = $35.00/hr x 1.627 = $56.945/hr loaded.
# HR reference $61.0125/hr; division head $82.132212/hr.
#
# C1 supervisor     12 hrs x $56.945    = $  683.34
# C1 HR             10 hrs x $61.0125   = $  610.125 -> $610.13
# C1 deciding        4 hrs x $82.132212 = $  328.529 -> $328.53
# C1 investigation  16 hrs x $61.0125   = $  976.20
#
# C3 backfill       20 shifts x 12 hrs = 240 hrs. Dispatch is minimum-staffing.
#                   Peer base $25.00 x 1.5 x 1.0765 = $40.36875/hr x 240 = $9,688.50
# C3-offset         240 hrs x $25.00 x 1.0765 = $6,459.00, recorded negative
#
# C4 internal HR    civil service board: 30 hrs x $61.0125 = $1,830.375 -> $1,830.38
# C4 counsel        8 hrs x $325 = $2,600.00
# NOTHING ELSE. The board has not ruled, so there is no back pay, no settlement and no
# interest -- the engine records what happened, not what might.
# Both C4 lines carry cost_incomplete, so the action is flagged.
#
# Gross $16,717.08   Offset -$6,459.00   Net $10,258.08   cost_incomplete = true

expected:
