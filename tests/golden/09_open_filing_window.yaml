# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Administrative specialist E1: $52,000 / 2,080 = $25.00/hr x 1.627 = $40.675/hr loaded.
# Division manager E2 (supervisor): $104,000 / 2,080 = $50.00/hr x 1.627 = $81.35/hr loaded.
#
# C1 supervisor  12 hrs x $81.35      = $976.20
# C1 HR          10 hrs x $61.0125    = $610.125 -> $610.13
# C1 deciding     4 hrs x $82.132212  = $328.529 -> $328.53
#
# C3 backfill: none. The role has no minimum staffing requirement, so nobody covers the post.
# C3-offset    3 shifts x 8 hrs = 24 hrs x $25.00 x 1.0765 = $645.90, recorded negative
#
# C4 open_filing_window: $0.00, flagged cost_incomplete.
#   The employee is represented, so the forums available are a grievance step (14-day window)
#   and arbitration (30-day window). The longest is 30 days, so the deadline is
#   2026-09-05 + 30 = 2026-10-05, which is after the 2026-09-17 extract date.
#   Nothing has been filed, so the appeal cost so far is genuinely zero -- but the total for
#   this action is a floor, not a settled figure, and the flag says so.
#
# Gross $1,914.86   Offset -$645.90   Net $1,268.96   cost_incomplete = true

