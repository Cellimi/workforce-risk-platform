name: "Exempt manager suspended without pay, with no written conduct policy"
description: >
  The saving that is not there. An operations manager is suspended for five days without
  pay, but the employer has no written workplace conduct policy applying to all employees.
  The FLSA salary-basis rule does not permit the deduction, so the manager is paid in full
  and there is no wage saving to credit. The engine says so in a zero-valued offset line
  rather than silently omitting it.
