# ---------------------------------------------------------------------------
# HAND CALCULATION
# ---------------------------------------------------------------------------
# Manager E1:  $124,800 / 2,080 = $60.00/hr base x 1.4287 = $85.722/hr loaded.
# Director E2: $166,400 / 2,080 = $80.00/hr base x 1.4287 = $114.296/hr loaded.
# HR reference $53.57625/hr; division head $105,000 x 1.4287 / 2,080 = $72.121875/hr.
#
# C1 supervisor  12 hrs x $114.296   = $1,371.552 -> $1,371.55
# C1 HR          10 hrs x $53.57625  = $535.7625  -> $535.76
# C1 deciding     4 hrs x $72.121875 = $288.4875  -> $288.49
# Not investigated, so no investigation hours.
#
# C3 COVER: none. The post has no staffing requirement, so nobody is called in and nothing
#   is billed. A manager's absence is absorbed, not covered.
#
# C3-OFFSET: $0.00, AND THAT IS THE POINT OF THIS CASE.
#   A five-day unpaid suspension looks like it saves five days of a $124,800 salary, about
#   $2,400. It does not. The FLSA salary-basis rule permits an unpaid disciplinary
#   suspension of an exempt employee only in full-day increments, in good faith, for
#   infractions of workplace conduct rules, and only under a written policy applicable to
#   all employees (29 CFR 541.602(b)(5)). This employer has no such policy, so the
#   deduction cannot lawfully be made: the manager serves the suspension on full pay and
#   there is no wage saving to credit.
#   The engine emits a zero-valued offset line saying so, rather than omitting it. A missing
#   line reads as a bug; a zero line with a reason reads as an answer. Set
#   written_conduct_policy to true and the saving appears.
#
# Gross = Net = $2,195.80, offset $0.00

expected:
  line_items:
    - {component: C1, subcomponent: deciding_hours, amount: '288.49'}
    - {component: C1, subcomponent: hr_hours, amount: '535.76'}
    - {component: C1, subcomponent: supervisor_hours, amount: '1371.55'}
    - {component: C3-offset, subcomponent: unpaid_suspension_not_available, amount: '0.00'}
  gross: '2195.80'
  offset: '0.00'
  net: '2195.80'
  cost_incomplete: false
